<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отримайте свій бонус та приєднуйтесь до Telegram</title>
    
    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._q)f._q=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/s/fbevents.js');
      
      // REPLACE 'YOUR_PIXEL_ID' with your real Pixel ID
      fbq('init', '1753903539013060'); 
      fbq('track', 'PageView');
    </script>
    <noscript>
      <img height="1" width="1" style="display:none"
           src="https://www.facebook.com/tr?id=1753903539013060&ev=PageView&noscript=1"/>
    </noscript>
    <!-- End Meta Pixel Code -->

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Dynamic background with a rich crypto/money vibe and abstract glowing shapes */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%),
                        radial-gradient(circle at 20% 30%, rgba(247, 147, 26, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.15) 0%, transparent 40%);
            background-blend-mode: overlay;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Floating background symbols for prizes, money, and bitcoins */
        .bg-symbols {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .symbol {
            position: absolute;
            font-size: 2rem;
            opacity: 0.12;
            animation: float 15s infinite linear;
        }

        .symbol:nth-child(1) { top: 10%; left: 10%; animation-duration: 12s; font-size: 3rem; }
        .symbol:nth-child(2) { top: 20%; right: 15%; animation-duration: 18s; font-size: 2.5rem; }
        .symbol:nth-child(3) { bottom: 15%; left: 20%; animation-duration: 14s; font-size: 3.5rem; }
        .symbol:nth-child(4) { bottom: 25%; right: 20%; animation-duration: 16s; font-size: 2.8rem; }
        .symbol:nth-child(5) { top: 50%; left: 5%; animation-duration: 20s; font-size: 2.2rem; }
        .symbol:nth-child(6) { top: 60%; right: 5%; animation-duration: 15s; font-size: 3.2rem; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 420px;
            width: 100%;
            z-index: 2;
            box-sizing: border-box;
        }

        .badge {
            background: rgba(247, 147, 26, 0.15);
            color: #f7931a;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid rgba(247, 147, 26, 0.3);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #ffffff;
            line-height: 1.3;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .telegram-btn {
            background: linear-gradient(135deg, #229ED9 0%, #1783b8 100%);
            color: white;
            border: none;
            padding: 16px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(34, 158, 217, 0.4);
        }

        .telegram-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 158, 217, 0.6);
            background: linear-gradient(135deg, #1f8ec4 0%, #1573a2 100%);
        }
    </style>
</head>
<body>

    <!-- Background decorative floating elements (Bitcoins, money, gifts) -->
    <div class="bg-symbols">
        <div class="symbol">🪙</div>
        <div class="symbol">💵</div>
        <div class="symbol">🚀</div>
        <div class="symbol">💰</div>
        <div class="symbol">🎁</div>
        <div class="symbol">💎</div>
    </div>

    <div class="card">
        <div class="badge">🔥 VIP-КАНАЛ & БОНУСИ</div>
        <h1>Отримайте свій бонус та приєднуйтесь!</h1>
        <p>Тут на вас чекають всі українські реферальні пропозиції які дають винагороду за звичайну реєстрацію</p>
        
        <!-- Telegram Redirect Button -->
        <a href="https://t.me/bonysnuk_ua" id="tgButton" class="telegram-btn" target="_blank">
            Приєднатися та забрати бонус
        </a>
    </div>

    <script>
        document.getElementById('tgButton').addEventListener('click', function() {
            // Fires a standard 'Lead' event when the button is clicked
            fbq('track', 'Lead');
        });
    </script>

</body>
</html>
